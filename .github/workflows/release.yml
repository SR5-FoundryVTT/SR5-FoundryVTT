name: Release Creation

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: Tag to use for a local-only artifact dry run
                required: true
                default: v0.0.0-test
permissions:
    contents: read

concurrency:
    group: release-${{ github.event.release.tag_name || inputs.tag }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        permissions:
            contents: write
        env:
            TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.13.1
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Normalize release version
              shell: bash
              run: |
                  version="${TAG_NAME#v}"
                  if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
                    echo "Unsupported release tag: $TAG_NAME" >&2
                    exit 1
                  fi
                  echo "VERSION=$version" >> "$GITHUB_ENV"

            - name: Prepare release manifest
              run: node scripts/prepare-release.mjs "$VERSION" "$TAG_NAME" "$GITHUB_REPOSITORY"

            - name: Install dependencies
              run: npm ci

            - name: Build application and compendiums once
              run: npm run package

            - name: Create release archive
              run: zip -r shadowrun5e.zip system.json LICENSE README.md README-DEV.md dist packs -x "packs/_source/*"

            - name: Upload release artifacts
              if: github.event_name == 'release'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "$TAG_NAME" system.json shadowrun5e.zip --clobber

            - name: Deploy stable release to Foundry
              if: github.event_name == 'release' && github.event.release.prerelease == false
              env:
                  FVTT_PACKAGE_RELEASE_TOKEN: ${{ secrets.FVTT_PACKAGE_RELEASE_TOKEN }}
              shell: bash
              run: |
                  payload="$(jq -n \
                    --arg version "v$VERSION" \
                    --arg manifest "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/system.json" \
                    --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG_NAME" \
                    --arg minimum "$(jq -r '.compatibility.minimum' system.json)" \
                    --arg verified "$(jq -r '.compatibility.verified' system.json)" \
                    --arg maximum "$(jq -r '.compatibility.maximum' system.json)" \
                    '{id:"shadowrun5e",release:{version:$version,manifest:$manifest,notes:$notes,compatibility:{minimum:$minimum,verified:$verified,maximum:$maximum}}}')"
                  curl --fail-with-body --retry 3 \
                    --request POST \
                    --header "Authorization: $FVTT_PACKAGE_RELEASE_TOKEN" \
                    --header "Content-Type: application/json" \
                    --data "$payload" \
                    https://api.foundryvtt.com/_api/packages/release_version
